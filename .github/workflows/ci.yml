name: CI

on:
  push:
  pull_request:

jobs:
  integration-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  mock-tive-sender:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-tive-sender
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mock-tive-sender/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
